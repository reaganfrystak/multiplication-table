<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table rendered in browser console</title>
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>

<section class="container">
    <h1>Multiplication Table Project &#127875;</h1>
    <h3>Create your own multiplication table that is rendered with an HTML table</h3>

    <div class="generate-box">
        <div class="inputs">
             <div class="rows">Rows:
                <input id="rows" type="number" value="10" placeholder="How many rows?"/>
             </div>

            <div class="cols"">Columns:
                <input id="cols" type="number" value="10" placeholder="How many cols?"/>
            </div>

            <div class="highlight">Highlights:
                <input id="highlight" type="number" placeholder="Highlight row and col?"/>
            </div>
    </div>

    <button id="generate" onclick="createWithHtmlTable(getRowsDesired(), getColumnsDesired(), getHighlightValue())">Generate Table!</button>
    </div>

    <div id="output"></div>
</section>

</body>
<script src="javascript.js"></script>
</html>
