<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Multiplication Table</title>
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>
<section class="container">
    <h1>Flexbox Multiplication Table &#9996</h1>
    <h3>Create your own multiplication table using Flexbox!</h3>

    <div class="generate-box">
        <div class="inputs">
            <div class="rows">
                Rows: <input id="rows" type="number" value="10" placeholder="How many rows?">
            </div>

            <div class="cols">
                Columns: <input id="cols" type="number" value="10" placeholder="How many columns?">
            </div>

            <div class="highlight">
                Highlights: <input id="highlight" type="number" placeholder="Highlight row and col?">
            </div>
        </div>

        <button id="generate"
                onclick="createWithFlexboxGrid(getRowsDesired(), getColumnsDesired(), getHighlightValue())">
            Generate Table!
        </button>

    </div>

    <div id="output"></div>

</section>

<script src="javascript.js"></script>
</body>
</html>
